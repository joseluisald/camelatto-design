server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    location = /health { access_log off; return 200 "ok"; }
    # This path follows astro.config.mjs. Change both if moving the public site.
    location /camelatto-design/ {
        rewrite ^/camelatto-design/(.*)$ /$1 break;
        try_files $uri $uri/index.html =404;
    }
    location / { try_files $uri $uri/index.html =404; }
}
